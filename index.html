<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playing Card</title>
    <meta name="description" content="A simple playing card created with HTML and CSS.">
    <link 
        rel="stylesheet" 
        href="./output.css">

    <link rel="icon" type="image/png" href="/meta/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/meta/favicon.svg" />
    <link rel="shortcut icon" href="/meta/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/meta/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="CardDemo" />
    <link rel="manifest" href="/meta/site.webmanifest" />
</head>
<body>
    <main id="playing-cards">
        <div class="card">
            <div class="left">
                <span>A</span>
                <span>♠</span>
            </div>
            <div class="middle">♠</div>
            <div class="right">
                <span>A</span>
                <span>♠</span>
            </div>
        </div>
        <div class="card">
            <div class="left">
                <span>2</span>
                <span>♣</span>
            </div>
            <div class="middle">
                <div>
                    <span>♣</span>
                </div>
                <div>
                    <span>♣</span>
                </div>
            </div>
            <div class="right">
                <span>2</span>
                <span>♣</span>
            </div>
        </div>
        <div class="card red">
            <div class="left">
                <span>3</span>
                <span>♥</span>
            </div>
            <div class="middle">
                <div>
                    <span>♥</span>
                </div>
                <span>♥</span>
                <div>
                    <span>♥</span>
                </div>
            </div>
            <div class="right">
                <span>3</span>
                <span>♥</span>
            </div>
        </div>
        <div class="card">
            <div class="left">
                <span>4</span>
                <span>♣</span>
            </div>
            <div class="middle">
                <div>
                    <span>♣</span>
                    <span>♣</span>
                </div>
                <div>
                    <span>♣</span>
                    <span>♣</span>
                </div>
            </div>
            <div class="right">
                <span>4</span>
                <span>♣</span>
            </div>
        </div>
        <div class="card red">
            <div class="left">
                <span>5</span>
                <span>♦</span>
            </div>
            <div class="middle">
                <div>
                    <span>♦</span>
                    <span>♦</span>
                </div>
                <div>
                    <span>♦</span>
                </div>
                <div>
                    <span>♦</span>
                    <span>♦</span>
                </div>
            </div>
            <div class="right">
                <span>5</span>
                <span>♦</span>
            </div>
        </div>
    </main>
</body>
</html>
